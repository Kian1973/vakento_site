name: AI-offerte tests
on:
  push:
    branches:
      - feature/ai-offerte-tarieven-20261027
  pull_request:
    paths:
      - 'js/brein.js'
      - 'js/app.js'
      - 'js/offerte-btw.js'
      - 'tests/unit/**'
      - '.github/workflows/ai-offerte-tests.yml'
jobs:
  offerte:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Controleer syntaxis
        run: |
          node --check js/brein.js
          node --check js/app.js
          node --check js/offerte-btw.js
      - name: Test offertes
        run: node --test tests/unit/offerte-ai.test.mjs

  browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Start lokale testsite
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/vakento-http.log 2>&1 &
      - name: Browsercontrole AI-offertes
        env:
          VAKENTO_BASE_URL: http://127.0.0.1:8765
        run: npx playwright test tests/e2e/ai-offerte-local.spec.mjs
